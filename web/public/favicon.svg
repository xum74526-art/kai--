<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="210 0 130 128" role="img" aria-labelledby="title">
  <title id="title">KAI影</title>
  <style>
    :root { --ink-start: #090806; --ink-mid: #2c2821; --ink-end: #080705; --detail: #4c453b; }
    @media (prefers-color-scheme: dark) {
      :root { --ink-start: #faf7f0; --ink-mid: #d8d1c4; --ink-end: #f2eee6; --detail: #d2cabc; }
    }
  </style>
