<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="610" height="128" viewBox="0 0 610 128" role="img" aria-labelledby="title desc">
  <title id="title">北斗 KAI影 - 星斗落墨</title>
  <desc id="desc">适用于深色界面的北斗星轨与墨月镜头标识，保留朱砂色，墨色调整为暖白。</desc>
