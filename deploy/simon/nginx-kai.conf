# Put these locations inside the existing origin `server {}` for simon.kai.com.
# TLS terminates at the company load balancer; the origin currently listens on HTTP.
# The root site is not changed. KAI影 is served only below /kai/.

location = /kai {
    return 308 /kai/;
}

# OAuth authorization codes and signed resource URLs must not enter the
# origin's default access log, whose format may include the query string.
location = /kai/oauth/linuxdo/callback {
    access_log off;
    rewrite ^/kai/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kai;
    proxy_redirect off;
}

location ^~ /kai/api/public/resources/ {
    access_log off;
    rewrite ^/kai/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kai;
    client_max_body_size 1024m;
}

# 分享 token 位于路径中；页面和 API 都禁止进入公司源站访问日志。
location ^~ /kai/api/public/canvas-shares/ {
    access_log off;
    rewrite ^/kai/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kai;
}

location ^~ /kai/share/canvas/ {
    access_log off;
    rewrite ^/kai/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kai;
    proxy_redirect off;
}

# Only the text-task event endpoint gets SSE buffering, cache, gzip, and long
# timeout exceptions. The query string (including `after`) is preserved.
location ~ ^/kai/api/tasks/[^/]+/text-events$ {
    rewrite ^/kai/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # HTTPS 在公司负载均衡处终止；固定外部协议，确保登录 Cookie 带 Secure。
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kai;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_pass_header X-Accel-Buffering;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /kai/api/ {
    rewrite ^/kai/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kai;
    proxy_pass_header X-Accel-Buffering;
    client_max_body_size 1024m;
}

location ^~ /kai/ {
    rewrite ^/kai/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kai;
    proxy_redirect off;
}
